name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  trigger-classification:
    if: |
      github.event.issue.user.login != 'github-actions[bot]' &&
      github.event.issue.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Trigger opencode classification
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const classificationPrompt = [
              '/opencode classify this issue and add appropriate labels.',
              '',
              'Read this issue and classify it as ONE of: bug, feature, improvement, documentation.',
              'Then add the corresponding label using: `gh issue edit ' + issue.number + ' --add-label "CLASSIFICATION"`',
              'Also add label "triaged".',
              'Reply with a brief explanation of your classification.',
              '',
              'Issue title: ' + issue.title,
              'Issue body: ' + (issue.body || '(empty)')
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: classificationPrompt
            });

            core.info('Classification triggered for issue #' + issue.number);
